<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL ASLI | الأصلي</title>
    <!-- مكتبة Supabase للربط السحابي -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: #262626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        header { background: rgba(11, 11, 11, 0.95); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--gold); letter-spacing: 2px; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .hero { text-align: center; padding: 3rem 1rem; background: linear-gradient(to bottom, #1a1a1a, var(--bg-color)); border-radius: 12px; margin-bottom: 2rem; border: 1px solid var(--border); }
        .hero h1 { color: var(--gold); font-size: 2.5rem; margin-bottom: 0.5rem; }
        .hero p { color: var(--text-muted); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
        .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: transform 0.3s; position: relative; }
        .product-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .product-img { width: 100%; height: 250px; object-fit: cover; background: #222; }
        .product-info { padding: 1.2rem; }
        .product-tag { position: absolute; top: 10px; right: 10px; background: var(--gold); color: #000; padding: 0.2rem 0.6rem; font-size: 0.8rem; font-weight: bold; border-radius: 4px; }
        .product-brand { color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; margin-bottom: 0.3rem; }
        .product-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 0.5rem; }
        .product-pricing { display: flex; gap: 0.8rem; align-items: center; margin-bottom: 1rem; }
        .current-price { color: var(--gold); font-size: 1.2rem; font-weight: bold; }
        .old-price { color: var(--text-muted); text-decoration: line-through; font-size: 0.9rem; }
        .btn-buy { width: 100%; background: var(--gold); color: #000; border: none; padding: 0.7rem; font-weight: bold; border-radius: 5px; cursor: pointer; transition: background 0.3s; }
        .btn-buy:hover { background: var(--gold-light); }
        
        /* لوحة الإدارة */
        #admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; padding: 1rem; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--gold); width: 100%; max-width: 600px; padding: 2rem; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { color: var(--gold); margin-bottom: 1.5rem; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 0.8rem; background: #1c1c1c; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
        .form-group input:focus { border-color: var(--gold); outline: none; }
        .btn-primary { width: 100%; background: var(--gold); color: #000; padding: 0.9rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-top: 1rem; }
        .admin-list { margin-top: 1.5rem; border-top: 1px solid var(--border); padding-top: 1rem; }
        .admin-item { display: flex; justify-content: space-between; align-items: center; background: #1c1c1c; padding: 0.7rem; margin-bottom: 0.5rem; border-radius: 6px; }
        .btn-delete { background: #ff4d4d; color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; }
        
        footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border); color: var(--text-muted); margin-top: 3rem; font-size: 0.9rem; }
        footer span { cursor: pointer; transition: color 0.3s; }
        footer span:hover { color: var(--gold); }
    </style>
</head>
<body>

    <header>
        <div class="logo">EL ASLI | الأصلي</div>
        <div>
            <button onclick="openAdminLogin()" style="background:transparent; border:1px solid var(--gold); color:var(--gold); padding:0.5rem 1rem; border-radius:5px; cursor:pointer;">لوحة التحكم</button>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>المجموعة الفاخرة</h1>
            <p>تشكيلة حصرية من الساعات، العطور، والاكسسوارات المصممة خصيصاً للرجل العصري</p>
        </div>

        <div id="products-grid" class="products-grid">
            <!-- المنتجات هتتحمل سحابياً هنا فوراً -->
            <p style="text-align: center; grid-column: 1/-1; color: var(--text-muted);">جاري تحميل المنتجات السحابية...</p>
        </div>
    </div>

    <!-- نافذة لوحة التحكم -->
    <div id="admin-modal">
        <div class="modal-content">
            <div id="login-section">
                <h2>تسجيل دخول المشرف</h2>
                <div class="form-group">
                    <label>كلمة المرور الإدارية</label>
                    <input type="password" id="admin-pass" placeholder="أدخل كلمة المرور">
                </div>
                <button class="btn-primary" onclick="verifyAdmin()">دخول</button>
                <button onclick="closeAdmin()" style="background:transparent; border:none; color:var(--text-muted); width:100%; margin-top:1rem; cursor:pointer;">إغلاق</button>
            </div>

            <div id="dashboard-section" style="display: none;">
                <h2>إدارة المنتجات (سحابي مباشر)</h2>
                <form id="product-form" onsubmit="addProduct(event)">
                    <div class="form-group">
                        <label>اسم المنتج</label>
                        <input type="text" id="p-name" required>
                    </div>
                    <div class="form-group">
                        <label>السعر (جنيه)</label>
                        <input type="number" id="p-price" required>
                    </div>
                    <div class="form-group">
                        <label>السعر القديم (اختياري للشطب)</label>
                        <input type="number" id="p-old">
                    </div>
                    <div class="form-group">
                        <label>القسم</label>
                        <input type="text" id="p-category" placeholder="ساعات، عطور، اكسسوارات" required>
                    </div>
                    <div class="form-group">
                        <label>الماركة / Brand</label>
                        <input type="text" id="p-brand" required>
                    </div>
                    <div class="form-group">
                        <label>رابط الصورة</label>
                        <input type="url" id="p-image" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>الوسم (Tag)</label>
                        <input type="text" id="p-tag" placeholder="Exclusive / Bestseller">
                    </div>
                    <button type="submit" class="btn-primary">إضافة المنتج للموقع</button>
                </form>

                <div class="admin-list">
                    <h3 style="color:var(--gold); margin-bottom:1rem; font-size:1rem;">المنتجات الحالية على السيرفر:</h3>
                    <div id="admin-products-list" style="max-height: 200px; overflow-y: auto;"></div>
                </div>
                <button onclick="closeAdmin()" class="btn-primary" style="background:#333; color:#fff; margin-top:1.5rem;">خروج من لوحة التحكم</button>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 <span onclick="openAdminLogin()">EL ASLI</span></p>
    </footer>

    <script>
        // إعدادات اتصال Supabase السحابي للمشروع
        const SUPABASE_URL = 'https://oujjgppajsvrflqapwm.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_L9o6bHpUQzrkJHFnmhwtNg_pOVHcp7J';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ADMIN_PASS = 'alasli2026';

        // تحميل المنتجات فور فتح الصفحة للجميع
        window.addEventListener('DOMContentLoaded', () => {
            fetchProducts();
        });

        async function fetchProducts() {
            const grid = document.getElementById('products-grid');
            const { data: products, error } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });

            if (error) {
                console.error('خطأ في جلب البيانات:', error);
                grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #ff4d4d;">تعذر الاتصال بالسيرفر السحابي حالياً.</p>';
                return;
            }

            if (!products || products.length === 0) {
                grid.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: var(--text-muted);">لا توجد منتجات مضافة حالياً في المتجر.</p>';
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    ${p.tag ? `<div class="product-tag">${p.tag}</div>` : ''}
                    <img src="${p.image}" alt="${p.name}" class="product-img" onerror="this.src='https://via.placeholder.com/300x250?text=EL+ASLI'">
                    <div class="product-info">
                        <div class="product-brand">${p.brand || 'EL ASLI'}</div>
                        <div class="product-title">${p.name}</div>
                        <div class="product-pricing">
                            <span class="current-price">${p.price} ج.م</span>
                            ${p.oldPrice ? `<span class="old-price">${p.oldPrice} ج.م</span>` : ''}
                        </div>
                        <button class="btn-buy" onclick="alert('تم إضافتك لطلب المنتج: ${p.name}')">اطلب الان</button>
                    </div>
                </div>
            `).join('');

            renderAdminList(products);
        }

        function openAdminLogin() {
            document.getElementById('admin-modal').style.display = 'flex';
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('dashboard-section').style.display = 'none';
            document.getElementById('admin-pass').value = '';
        }

        function closeAdmin() {
            document.getElementById('admin-modal').style.display = 'none';
        }

        function verifyAdmin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PASS) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                loadAdminProducts();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        async function loadAdminProducts() {
            const { data: products } = await supabaseClient.from('products').select('*').order('created_at', { ascending: false });
            renderAdminList(products || []);
        }

        function renderAdminList(products) {
            const listContainer = document.getElementById('admin-products-list');
            if (!products || products.length === 0) {
                listContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">لا توجد منتجات مسجلة.</p>';
                return;
            }
            listContainer.innerHTML = products.map(p => `
                <div class="admin-item">
                    <span>${p.name} - ${p.price} ج.م</span>
                    <button class="btn-delete" onclick="deleteProduct(${p.id})">حذف</button>
                </div>
            `).join('');
        }

        async function addProduct(e) {
            e.preventDefault();
            const newProduct = {
                name: document.getElementById('p-name').value,
                price: parseFloat(document.getElementById('p-price').value),
                oldPrice: document.getElementById('p-old').value ? parseFloat(document.getElementById('p-old').value) : null,
                category: document.getElementById('p-category').value,
                brand: document.getElementById('p-brand').value,
                image: document.getElementById('p-image').value,
                tag: document.getElementById('p-tag').value
            };

            const { error } = await supabaseClient.from('products').insert([newProduct]);

            if (error) {
                alert('حدث خطأ أثناء الإضافة: ' + error.message);
            } else {
                alert('تم إضافة المنتج بنجاح ورفعه للسيرفر!');
                document.getElementById('product-form').reset();
                fetchProducts();
                loadAdminProducts();
            }
        }

        async function deleteProduct(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج نهائياً من المتجر؟')) {
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if (error) {
                    alert('خطأ في الحذف: ' + error.message);
                } else {
                    fetchProducts();
                    loadAdminProducts();
                }
            }
        }
    </script>
</body>
</html>
